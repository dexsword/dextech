# Trusted base-branch configuration, copied outside both Git checkouts.
# Features are set here: codex-action intentionally forbids feature overrides
# through codex-args with drop-sudo. No PR project configuration is loaded.
model = "gpt-5.4"
model_reasoning_effort = "high"
approval_policy = "never"
project_doc_max_bytes = 0
web_search = "disabled"
hide_agent_reasoning = true

[history]
persistence = "none"

[features]
shell_tool = false
unified_exec = false
experimental_use_unified_exec_tool = false
shell_snapshot = false
shell_snapshot_v2 = false
apply_patch_freeform = false
js_repl = false
code_mode = false
code_mode_host = false
multi_agent = false
multi_agent_v2 = false
collab = false
apps = false
connectors = false
plugins = false
remote_plugin = false
skill_mcp_dependency_install = false
skill_search = false
skip_host_skill_discovery = true
hooks = false
codex_hooks = false
plugin_hooks = false
browser_use = false
computer_use = false
image_generation = false
view_image = false
search_tool = false
tool_search = false
memory_tool = false
memories = false
remote_control = false
