name: Codex Review
# Irrelevant edits must neither cancel nor supersede an active review.
run-name: "${{ github.event.action == 'edited' && !github.event.changes.base.ref.from && 'Ignored PR edit #' || 'Codex review PR #' }}${{ github.event.pull_request.number }}"

# pull_request_target deliberately loads workflow/code/instructions from main.
# Candidate files are read as data only; never run npm or scripts from the PR.
on:
  pull_request_target:
    branches: [main]
    # Closing/merging needs no new review and must not cancel its final jobs.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

concurrency:
  group: codex-review-pr-${{ github.event.action == 'edited' && !github.event.changes.base.ref.from && format('ignored-{0}', github.run_id) || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base.ref.from) &&
      github.repository == 'dexsword/dextech' &&
      github.event.pull_request.base.repo.full_name == 'dexsword/dextech' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'dexsword/dextech'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: write
    outputs:
      active: ${{ steps.snapshot.outputs.active }}
      draft: ${{ steps.snapshot.outputs.draft }}
      head: ${{ steps.snapshot.outputs.head }}
      merge: ${{ steps.snapshot.outputs.merge }}
      base: ${{ steps.snapshot.outputs.base }}
      number: ${{ steps.snapshot.outputs.number }}
      gate_id: ${{ steps.snapshot.outputs.gate_id }}
      eligible_id: ${{ steps.snapshot.outputs.eligible_id }}
      legacy: ${{ steps.snapshot.outputs.legacy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - id: snapshot
        name: Disarm and bind pending source-head checks to this trusted run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node control/.github/codex/control.cjs snapshot

  eligibility:
    if: needs.snapshot.outputs.active == 'true'
    needs: [snapshot, disarm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
    env:
      HEAD_SHA: ${{ needs.snapshot.outputs.head }}
      MERGE_SHA: ${{ needs.snapshot.outputs.merge }}
      BASE_SHA: ${{ needs.snapshot.outputs.base }}
      PR_NUMBER: ${{ needs.snapshot.outputs.number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          persist-credentials: false
          path: control
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
          path: candidate
      - id: classify
        run: node control/.github/codex/control.cjs classify

  review:
    if: needs.snapshot.outputs.active == 'true'
    needs: [snapshot, disarm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    env:
      HEAD_SHA: ${{ needs.snapshot.outputs.head }}
      MERGE_SHA: ${{ needs.snapshot.outputs.merge }}
      BASE_SHA: ${{ needs.snapshot.outputs.base }}
      PR_NUMBER: ${{ needs.snapshot.outputs.number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          persist-credentials: false
          path: control
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
          path: candidate
      - name: Prepare bounded text-only review from immutable Git objects
        run: node control/.github/codex/control.cjs prepare
      # Drafts leave snapshot inactive; only ready PRs reach this key-bearing job.
      # Must remain the final substantive step. No PR scripts, package installs,
      # artifacts, credentials, or GitHub writes after privilege dropping.
      - name: Read-only Codex review
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11 (upstream release tag)
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.153.4'
          safety-strategy: drop-sudo
          sandbox: read-only
          working-directory: ${{ runner.temp }}/codex-review-work
          codex-home: ${{ runner.temp }}/codex-review-home
          prompt-file: ${{ runner.temp }}/codex-review-prompt.txt
          output-schema-file: ${{ github.workspace }}/control/.github/codex/review.schema.json
          # Same-repository guard + API snapshot are the trust boundary, including
          # same-repository bot contributions. Forks never reach this action.
          allow-users: '*'

  disarm:
    if: ${{ always() && needs.snapshot.result == 'success' && needs.snapshot.outputs.active == 'true' }}
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          persist-credentials: false
          path: control
      - name: Revoke any previous native auto-merge request before final checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.snapshot.outputs.head }}
          MERGE_SHA: ${{ needs.snapshot.outputs.merge }}
          BASE_SHA: ${{ needs.snapshot.outputs.base }}
          PR_NUMBER: ${{ needs.snapshot.outputs.number }}
        run: node control/.github/codex/control.cjs disarm

  publish:
    # Migration only: automatically stops once the legacy requirements are removed.
    if: ${{ always() && needs.snapshot.result == 'success' && needs.snapshot.outputs.active == 'true' && needs.snapshot.outputs.legacy == 'true' }}
    needs: [snapshot, eligibility, review, disarm, auto-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      checks: write
    outputs:
      passed: ${{ steps.publish.outputs.passed }}
      eligible: ${{ steps.publish.outputs.eligible }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          persist-credentials: false
          path: control
      - id: publish
        name: Validate schema and publish source-head checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.snapshot.outputs.head }}
          MERGE_SHA: ${{ needs.snapshot.outputs.merge }}
          BASE_SHA: ${{ needs.snapshot.outputs.base }}
          PR_NUMBER: ${{ needs.snapshot.outputs.number }}
          GATE_ID: ${{ needs.snapshot.outputs.gate_id }}
          ELIGIBLE_ID: ${{ needs.snapshot.outputs.eligible_id }}
          REVIEW_JSON: ${{ needs.review.outputs.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          DISARM_RESULT: ${{ needs.disarm.result }}
          ELIGIBILITY_RESULT: ${{ needs.eligibility.result }}
          ELIGIBLE: ${{ needs.eligibility.outputs.eligible }}
          PR_DRAFT: ${{ needs.snapshot.outputs.draft }}
          AUTO_MERGE_RESULT: ${{ needs.auto-merge.result }}
          REQUEST_RESULT: ${{ needs.auto-merge.outputs.request_result }}
          LEGACY_CHECKS: ${{ needs.snapshot.outputs.legacy }}
          CONFIRMED_HEAD: ${{ needs.auto-merge.outputs.confirmed_head }}
          CONFIRMED_MERGE: ${{ needs.auto-merge.outputs.confirmed_merge }}
          CONFIRMED_BASE: ${{ needs.auto-merge.outputs.confirmed_base }}
          CONFIRMED_RUN: ${{ needs.auto-merge.outputs.confirmed_run }}
          CONFIRMED_APP: ${{ needs.auto-merge.outputs.confirmed_app }}
        run: node control/.github/codex/control.cjs publish

  feedback:
    if: ${{ always() && needs.snapshot.result == 'success' && needs.snapshot.outputs.active == 'true' && needs.review.result == 'success' }}
    needs: [snapshot, review, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          persist-credentials: false
          path: control
      - name: Publish metadata-only exact-head review feedback
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.snapshot.outputs.head }}
          MERGE_SHA: ${{ needs.snapshot.outputs.merge }}
          BASE_SHA: ${{ needs.snapshot.outputs.base }}
          PR_NUMBER: ${{ needs.snapshot.outputs.number }}
          REVIEW_JSON: ${{ needs.review.outputs.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: node control/.github/codex/control.cjs feedback

  auto-merge:
    # A failed/skipped prerequisite must produce a failed required gate.
    # Draft/ignored events use another name: a skipped job must not pass the gate.
    name: ${{ (github.event.pull_request.draft || github.event.action == 'converted_to_draft') && 'Draft PR' || (github.event.action == 'closed' || (github.event.action == 'edited' && !github.event.changes.base.ref.from)) && 'Inactive PR event' || 'merge-gate' }}
    if: >-
      always() && !github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from)
    needs: [snapshot, disarm, eligibility, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    outputs:
      confirmed_head: ${{ steps.request.outputs.confirmed_head }}
      confirmed_merge: ${{ steps.request.outputs.confirmed_merge }}
      confirmed_base: ${{ steps.request.outputs.confirmed_base }}
      confirmed_run: ${{ steps.request.outputs.confirmed_run }}
      confirmed_app: ${{ steps.request.outputs.confirmed_app }}
      request_result: ${{ steps.request.outcome }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.snapshot.outputs.head }}
      MERGE_SHA: ${{ needs.snapshot.outputs.merge }}
      BASE_SHA: ${{ needs.snapshot.outputs.base }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SNAPSHOT_RESULT: ${{ needs.snapshot.result }}
      SNAPSHOT_ACTIVE: ${{ needs.snapshot.outputs.active }}
      PR_DRAFT: ${{ needs.snapshot.outputs.draft }}
      DISARM_RESULT: ${{ needs.disarm.result }}
      ELIGIBILITY_RESULT: ${{ needs.eligibility.result }}
      ELIGIBLE: ${{ needs.eligibility.outputs.eligible }}
      REVIEW_RESULT: ${{ needs.review.result }}
      REVIEW_JSON: ${{ needs.review.outputs.result }}
      LEGACY_CHECKS: ${{ needs.snapshot.outputs.legacy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Available even if snapshot failed; always the trusted event base.
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - name: Validate prerequisites and the current native gate
        id: gate
        run: node control/.github/codex/control.cjs gate-prepare
      # Only this trusted final job gets App credentials. Scope the token to
      # this repository and these two permissions; retain post-job revocation.
      - name: Create scoped merge App token
        if: steps.gate.outputs.request == 'true'
        id: merge-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEXTECH_MERGE_APP_ID }}
          private-key: ${{ secrets.DEXTECH_MERGE_APP_PRIVATE_KEY }}
          owner: dexsword
          repositories: dextech
          permission-contents: write
          permission-pull-requests: write
      - name: Request and confirm native squash auto-merge while merge-gate is running
        if: steps.gate.outputs.request == 'true'
        id: request
        env:
          MERGE_APP_TOKEN: ${{ steps.merge-app.outputs.token }}
          MERGE_APP_SLUG: ${{ steps.merge-app.outputs.app-slug }}
          GATE_ID: ${{ needs.snapshot.outputs.gate_id }}
          ELIGIBLE_ID: ${{ needs.snapshot.outputs.eligible_id }}
        run: node control/.github/codex/control.cjs request
      - name: Finish the native gate after independent confirmation
        env:
          REQUEST_RESULT: ${{ steps.request.outcome }}
          CONFIRMED_HEAD: ${{ steps.request.outputs.confirmed_head }}
          CONFIRMED_BASE: ${{ steps.request.outputs.confirmed_base }}
          CONFIRMED_MERGE: ${{ steps.request.outputs.confirmed_merge }}
          CONFIRMED_RUN: ${{ steps.request.outputs.confirmed_run }}
          CONFIRMED_APP: ${{ steps.request.outputs.confirmed_app }}
        run: node control/.github/codex/control.cjs gate-finish
