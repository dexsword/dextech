name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Every subscribed event must produce the real required check.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - name: Clean install, complete tests and CI checks
        run: bash scripts/deployment-checks.sh
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # One-time installation evidence; archived run retention must not affect
      # future application CI. The operator command remains available afterward.
      - name: Verify live merge App contracts for installation
        if: github.repository == 'dexsword/dextech' && github.event.pull_request.number == 23 && github.event.pull_request.head.repo.full_name == 'dexsword/dextech'
        run: node scripts/verify-merge-app-live.cjs
