name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Reject tracked environment files and private keys
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              .env|*/.env|*.key|*.pem)
                printf 'Forbidden tracked file: %s\n' "$file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          exit "$failed"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            case "$file" in
              node_modules/*|*/node_modules/*) continue ;;
              *.js|*.cjs|*.mjs) node --check "./$file" ;;
            esac
          done < <(git ls-files -z)

      - name: Check temporary server health
        run: |
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/dextech-health.XXXXXX")
          server_log="$smoke_dir/server.log"
          server_pid=''

          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if (( status != 0 )) && [[ -f "$server_log" ]]; then
              cat "$server_log"
            fi
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              for attempt in {1..5}; do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              kill -KILL "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Keep dotenv loading and legacy bookings.json migration away from checkout data.
          cp server.js "$smoke_dir/server.js"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$smoke_dir/node_modules"
          cd "$smoke_dir"
          env -i PATH="$PATH" NODE_ENV=test PORT=3100 \
            DB_PATH="$smoke_dir/bookings.db" \
            node server.js > "$server_log" 2>&1 &
          server_pid=$!

          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Temporary server exited before becoming healthy.'
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:3100/health > "$smoke_dir/health.json" &&
              node -e 'const h = require(process.argv[1]); process.exit(h.status === "ok" && h.confirmed_bookings === 0 && h.email_enabled === false && h.gcal_enabled === false ? 0 : 1)' "$smoke_dir/health.json" &&
              kill -0 "$server_pid" 2>/dev/null; then
              echo 'Temporary server is healthy; integrations are disabled.'
              exit 0
            fi
            sleep 1
          done
          echo 'Timed out waiting for temporary server health.'
          exit 1
