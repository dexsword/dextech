# Paste these two lines inside the HTTPS VirtualHost (*:443) of
# /etc/apache2/sites-available/dextech.conf, next to the existing
# /admin ProxyPass / ProxyPassReverse pair. Do not Include this
# file as a separate Apache config: only dextech.conf is covered
# by the deployer's protected snapshot. GitHub Actions and
# dextech-deploy do not install or rewrite this vhost.
ProxyPass /cancel http://localhost:3000/cancel
ProxyPassReverse /cancel http://localhost:3000/cancel
