# Paste or Include inside the HTTPS VirtualHost (*:443) of
# /etc/apache2/sites-available/dextech.conf, next to the existing
# /admin ProxyPass / ProxyPassReverse pair. GitHub Actions and
# dextech-deploy do not install or rewrite this vhost.
ProxyPass /cancel http://localhost:3000/cancel
ProxyPassReverse /cancel http://localhost:3000/cancel
