# Reviewed operator change: paste inside the HTTPS VirtualHost in dextech.conf.
# Keep this in dextech.conf so the existing deployment snapshot covers it.
# Also change the HTTP vhost redirect target to https://dextech.cloud%{REQUEST_URI}.
RewriteEngine On
RewriteCond %{HTTP_HOST} ^www\.dextech\.cloud(?::[0-9]+)?$ [NC]
RewriteRule ^ https://dextech.cloud%{REQUEST_URI} [R=301,L,NE]
RewriteCond %{THE_REQUEST} \s/+index\.html(?:[?\s]) [NC]
RewriteRule ^/?index\.html$ https://dextech.cloud/ [R=301,L]
